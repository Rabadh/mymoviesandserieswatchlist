<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Watchlist</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0d0d14;--surface:#111118;--border:#1e1e2a;--border-light:#14141c;
  --text:#e0ddd6;--muted:#666;--dim:#2e2e3a;
  --gold:#c8971a;--gold-l:#f5c518;--green:#4caf50;--red:#e53935;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh;}

/* Dup alert */
#dup-alert{display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:var(--red);color:#fff;font-size:16px;font-weight:500;padding:16px 24px;text-align:center;animation:slideDown .2s ease;}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}

/* Header */
.header{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;color:var(--gold-l);line-height:1;flex-shrink:0;}
.logo span{color:var(--text);}

/* Profile chips */
.profile-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.pchip{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;}
.pchip.on{background:var(--gold);color:#0d0d14;border-color:var(--gold);font-weight:500;}
.pchip.add{border-style:dashed;}
.pchip.add:hover{border-color:var(--gold);color:var(--gold);}
.pdel{background:none;border:none;color:inherit;cursor:pointer;font-size:11px;opacity:.6;padding:0 2px;line-height:1;}
.pdel:hover{opacity:1;color:var(--red);}

.header-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.uname{font-size:12px;color:var(--muted);}
.logout-btn{padding:5px 12px;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;}
.logout-btn:hover{border-color:var(--red);color:var(--red);}

/* Stats */
.stats{display:flex;gap:8px;flex-wrap:wrap;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:4px 12px;text-align:center;}
.stat-n{font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1;}
.stat-n.gold{color:var(--gold);}
.stat-n.green{color:var(--green);}
.stat-l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}

.prog-wrap{height:2px;background:var(--border);}
.prog-bar{height:100%;background:var(--gold);transition:width .4s;width:0%;}

/* Controls */
.controls{padding:9px 24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;background:var(--bg);}
input[type=text]{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:6px 11px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .2s;}
input[type=text]:focus{border-color:var(--gold);}
input[type=text]::placeholder{color:var(--dim);}
select{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:6px 10px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;outline:none;cursor:pointer;}
.fbtn{padding:6px 13px;border-radius:3px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .15s;}
.fbtn.on{background:var(--gold);color:#0d0d14;border-color:var(--gold);font-weight:500;}
.gbtn{padding:6px 14px;background:var(--gold);color:#0d0d14;border:none;border-radius:3px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer;white-space:nowrap;}
.gbtn:disabled{opacity:.5;cursor:not-allowed;}
.rbtn{padding:6px 13px;background:var(--red);color:#fff;border:none;border-radius:3px;font-size:12px;cursor:pointer;display:none;white-space:nowrap;}
.vbtn{width:28px;height:28px;border-radius:3px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;}
.vbtn.on{border-color:var(--gold);color:var(--gold);}

/* Autocomplete */
#sug{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:3px;z-index:500;display:none;min-width:240px;max-height:260px;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,.6);}
.si{padding:8px 12px;cursor:pointer;font-size:13px;color:var(--text);border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:10px;}
.si:last-child{border-bottom:none;}
.si:hover,.si.active{background:var(--border);}
.si img{width:26px;height:38px;object-fit:cover;border-radius:2px;flex-shrink:0;background:var(--border);}
.si-meta{font-size:11px;color:var(--muted);margin-top:2px;}

/* Section heading */
.sh{padding:9px 24px 6px;font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.sc{font-weight:400;color:var(--dim);}

/* LIST grid: cb | toggle | poster | title(180px) | desc | type | genres | runtime | imdb | actions */
.ch,.lr{display:grid;grid-template-columns:18px 24px 40px 180px minmax(0,1fr) 86px minmax(0,125px) 68px 70px 58px;gap:9px;padding:5px 24px;align-items:start;}
.ch{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);border-bottom:1px solid var(--border-light);align-items:center;}
.lr{border-bottom:1px solid var(--border-light);transition:background .1s;}
.lr:hover{background:var(--surface);}
.lr.watched{border-left:2px solid var(--green);padding-left:22px;}
.lr.sel{background:#17170a;}

.cb{width:13px;height:13px;accent-color:var(--gold);cursor:pointer;margin-top:5px;flex-shrink:0;}
.tog{width:20px;height:20px;border-radius:50%;border:1.5px solid #333;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;transition:all .15s;flex-shrink:0;margin-top:3px;}
.tog.on{background:var(--green);border-color:var(--green);}
.tog:hover{border-color:var(--green);}

.pw{width:28px;height:42px;flex-shrink:0;border-radius:2px;overflow:hidden;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--dim);}
.pw img{width:100%;height:100%;object-fit:cover;display:block;}

.tc{font-size:13px;font-weight:500;line-height:1.3;overflow:hidden;padding-top:2px;}
.tn{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ty{font-size:11px;color:var(--muted);font-weight:300;display:block;}

.dw{padding-top:2px;min-width:0;}
.dt{font-size:11px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.dt.exp{display:block;}
.dm{font-size:10px;color:var(--gold);cursor:pointer;margin-top:2px;display:inline-block;}

.badge{font-size:10px;padding:2px 6px;border-radius:2px;display:inline-block;margin-top:3px;}
.t-Movie{background:#1a2010;color:#88aa44;}
.t-Series{background:#1e1e2e;color:#8888cc;}
.t-Mini{background:#1e1a2a;color:#9977cc;}
.t-Anime{background:#2a1e10;color:#cc8833;}
.t-Documentary{background:#0f2a1a;color:#44aa66;}
.t-Reality{background:#2a1028;color:#bb55cc;}

.gn{font-size:11px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-top:3px;}
.rt{font-size:12px;color:var(--muted);padding-top:3px;}
.rc{display:flex;align-items:center;gap:4px;padding-top:3px;}
.ib{background:var(--gold-l);color:#000;font-size:9px;font-weight:700;padding:1px 4px;border-radius:2px;}
.rn{font-size:13px;font-weight:500;color:var(--gold);}
.dash{color:var(--dim);font-size:12px;padding-top:3px;display:block;}

.acts{display:flex;gap:4px;align-items:center;padding-top:2px;}
.ab{width:24px;height:24px;border-radius:3px;border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s;color:var(--muted);}
.ab:hover{border-color:var(--gold);color:var(--gold);}
.ab.del:hover{border-color:var(--red);color:var(--red);}

/* CARD grid */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;padding:16px 24px;}
.ci{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;position:relative;transition:transform .15s,border-color .15s;}
.ci:hover{transform:translateY(-2px);border-color:#2e2e4e;}
.ci.watched{border-left:3px solid var(--green);}
.ci.sel{border-color:var(--gold);}
.cp{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--dim);}
.cp-ph{width:100%;aspect-ratio:2/3;background:#1a1a28;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--dim);}
.cb2{position:absolute;top:6px;left:6px;width:14px;height:14px;accent-color:var(--gold);cursor:pointer;}
.cw{position:absolute;bottom:58px;right:6px;width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);background:rgba(0,0,0,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;transition:all .15s;}
.cw.on{background:var(--green);border-color:var(--green);}
.ca{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:3px;opacity:0;transition:opacity .15s;}
.ci:hover .ca{opacity:1;}
.cab{width:22px;height:22px;border-radius:3px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.75);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;}
.cb-body{padding:7px 9px;}
.ct{font-size:12px;font-weight:500;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.cm{font-size:10px;color:var(--muted);margin-top:3px;}
.cr{color:var(--gold);font-weight:500;}

/* Dots */
.dot{width:4px;height:4px;background:var(--gold);border-radius:50%;display:inline-block;animation:blink .8s infinite;margin:0 1px;}
.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}

.empty{padding:50px 24px;text-align:center;color:var(--muted);font-size:13px;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:12px;padding:8px 16px;border-radius:4px;display:none;z-index:100;}

/* Modal */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;}
.mo.open{display:flex;}
.md{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:24px;width:420px;max-width:95vw;}
.md h3{font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:1px;margin-bottom:16px;color:var(--gold-l);}
.md label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-top:11px;margin-bottom:4px;}
.md input,.md textarea,.md select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:7px 10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;}
.md textarea{resize:vertical;min-height:80px;line-height:1.5;}
.md input:focus,.md textarea:focus{border-color:var(--gold);}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
.mbtns button{padding:7px 16px;border-radius:3px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--muted);}
.mbtns .sv{background:var(--gold);color:#0d0d14;border-color:var(--gold);font-weight:500;}

/* Recommendation rows (horizontal scroll, reuses card look) */
.rec-row{display:flex;gap:12px;overflow-x:auto;padding:10px 24px 18px;scroll-snap-type:x proximity;}
.rec-card{flex:0 0 152px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;}
.rec-card .cp{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--dim);}
.rec-card .cp-ph{width:100%;aspect-ratio:2/3;background:#1a1a28;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--dim);}
.rec-card .cb-body{padding:8px 9px;display:flex;flex-direction:column;gap:3px;flex:1;}
.rec-card .ct{font-size:12px;font-weight:500;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.rec-card .cm{font-size:10px;color:var(--muted);}
.rec-card .cplot{font-size:10.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px;}
.rec-card .rab{width:100%;margin-top:auto;padding:5px 0;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--gold);font-size:11px;font-weight:500;cursor:pointer;}
.rec-card .rab:hover{border-color:var(--gold);}
.rec-card .rab.added{color:var(--green);border-color:var(--green);opacity:.7;pointer-events:none;}
</style>
</head>
<body>

<div id="dup-alert"></div>

<div class="header">
  <div class="logo">My <span>Watchlist</span></div>
  <div class="profile-bar" id="pbar"></div>
  <div class="header-right">
    <div class="stats">
      <div class="stat"><div class="stat-n" id="st">0</div><div class="stat-l">Total</div></div>
      <div class="stat"><div class="stat-n green" id="sw">0</div><div class="stat-l">Watched</div></div>
      <div class="stat"><div class="stat-n" id="sp">0</div><div class="stat-l">Pending</div></div>
      <div class="stat"><div class="stat-n gold" id="sl">0</div><div class="stat-l">Loaded</div></div>
    </div>
    <span class="uname" id="uname"></span>
    <button class="logout-btn" onclick="doLogout()">Sign out</button>
  </div>
</div>
<div class="prog-wrap"><div class="prog-bar" id="prog"></div></div>

<div class="controls">
  <input type="text" id="search" placeholder="Search…" style="width:150px;" oninput="render()">
  <input type="text" id="newTitle" placeholder="Add title…" style="width:195px;"
    oninput="onAddInput()" onkeydown="onAddKey(event)" autocomplete="off">
  <button class="fbtn" onclick="addTitle()">Add</button>
  <button class="fbtn on" id="f-pending" onclick="setFilter('pending',this)">Pending</button>
  <button class="fbtn" id="f-all"     onclick="setFilter('all',this)">All</button>
  <button class="fbtn" id="f-watched" onclick="setFilter('watched',this)">Watched</button>
  <select id="sort" onchange="render()">
    <option value="default">Default</option>
    <option value="alpha">A – Z</option>
    <option value="rating">Top rated</option>
  </select>
  <button class="vbtn on" id="vl" onclick="setView('list')" title="List view">☰</button>
  <button class="vbtn"    id="vc" onclick="setView('card')" title="Card view">⊞</button>
  <button class="rbtn" id="bdb" onclick="bulkDelete()">Delete selected</button>
  <button class="fbtn" onclick="openBulkAdd()" title="Add multiple titles at once">Bulk Add</button>
  <button class="gbtn" id="fab" onclick="refetchAll()">Reload info</button>
</div>

<div class="sh">Recommended for you</div>
<div class="rec-row" id="rec-row"><div class="empty" style="padding:16px 0">Loading recommendations…</div></div>

<div id="sug"></div>
<div id="body"></div>
<div class="toast" id="toast"></div>

<!-- Edit modal -->
<div class="mo" id="emod">
  <div class="md">
    <h3>Edit Entry</h3>
    <label>Title</label><input type="text" id="e-t">
    <label>Description</label><textarea id="e-d" placeholder="Brief description…"></textarea>
    <label>Type</label>
    <select id="e-ty"><option>Movie</option><option>Series</option><option>Mini-Series</option><option>Anime</option><option>Documentary</option><option>Reality</option></select>
    <label>Genres (comma separated)</label><input type="text" id="e-g">
    <label>Runtime</label><input type="text" id="e-r" placeholder="e.g. 2h 15m or 3 seasons">
    <label>IMDb Rating</label><input type="text" id="e-i" placeholder="e.g. 8.5">
    <div class="mbtns">
      <button onclick="closeModal('emod')">Cancel</button>
      <button class="sv" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<!-- New profile modal -->
<div class="mo" id="npmod">
  <div class="md">
    <h3>New Profile</h3>
    <label>Profile name</label>
    <input type="text" id="np-n" placeholder="e.g. Kids, Partner, Work…" onkeydown="if(event.key==='Enter')saveProfile()">
    <div class="mbtns">
      <button onclick="closeModal('npmod')">Cancel</button>
      <button class="sv" onclick="saveProfile()">Create</button>
    </div>
  </div>
</div>

<!-- Bulk add modal -->
<div class="mo" id="bamod">
  <div class="md" style="width:500px;">
    <h3>Bulk Add Titles</h3>
    <label>Paste titles — one per line</label>
    <textarea id="ba-text" placeholder="Breaking Bad&#10;The Sopranos&#10;Inception&#10;…" style="min-height:220px;margin-top:4px;font-size:13px;line-height:1.7;"></textarea>
    <div id="ba-status" style="font-size:12px;color:var(--muted);margin-top:10px;min-height:18px;"></div>
    <div class="mbtns">
      <button onclick="closeModal('bamod')">Cancel</button>
      <button class="sv" id="ba-btn" onclick="runBulkAdd()">Import</button>
    </div>
  </div>
</div>

<script>
// ── Utils ──────────────────────────────────────────────────────
function toPC(s){
  const m=new Set(['a','an','the','and','but','or','for','nor','on','at','to','by','in','of','up','as','is','it','vs']);
  return s.trim().replace(/\s+/g,' ').split(' ').map((w,i)=>{const l=w.toLowerCase();return(i&&m.has(l))?l:w[0].toUpperCase()+w.slice(1);}).join(' ');
}

// ── State ──────────────────────────────────────────────────────
let profiles=[], curPid=null, entries=[], loadingIds=new Set();
let filter='pending', view='list', editId=null, selIds=new Set();
let sugT=null, sugItems=[], sugIdx=-1;
let recs=[];

// ── Boot ──────────────────────────────────────────────────────
async function init(){
  const r=await fetch('/api/me',{credentials:'include'});
  const me=await r.json();
  if(!me.authenticated){window.location.href='/';return;}
  document.getElementById('uname').textContent=me.username;
  profiles=me.profiles;
  if(profiles.length) await switchProfile(profiles[0].id);
  renderPbar();
}

// ── Profiles ──────────────────────────────────────────────────
function renderPbar(){
  const bar=document.getElementById('pbar');
  bar.innerHTML=profiles.map(p=>`
    <div class="pchip ${p.id===curPid?'on':''}" onclick="switchProfile(${p.id})">
      ${p.name}
      ${profiles.length>1?`<button class="pdel" onclick="event.stopPropagation();delProfile(${p.id})">✕</button>`:''}
    </div>`).join('')
    +`<div class="pchip add" onclick="document.getElementById('npmod').classList.add('open')">+ New profile</div>`;
}

async function switchProfile(id){
  curPid=id; selIds.clear();
  const r=await fetch(`/api/profiles/${id}/entries`,{credentials:'include'});
  entries=await r.json();
  renderPbar(); render();
  const missing=entries.filter(e=>!e.type&&!loadingIds.has(e.id));
  missing.forEach(e=>fetchAndSave(e));
  loadRecs();
}

async function saveProfile(){
  const name=document.getElementById('np-n').value.trim();
  if(!name) return;
  const r=await fetch('/api/profiles',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
  const p=await r.json();
  profiles.push(p);
  closeModal('npmod');
  document.getElementById('np-n').value='';
  await switchProfile(p.id);
}

async function delProfile(id){
  if(!confirm('Delete this profile and all its entries?')) return;
  await fetch(`/api/profiles/${id}`,{method:'DELETE',credentials:'include'});
  profiles=profiles.filter(p=>p.id!==id);
  if(curPid===id && profiles.length) await switchProfile(profiles[0].id);
  else renderPbar();
}

// ── Filtering / sorting ────────────────────────────────────────
function setFilter(f,btn){
  filter=f;
  document.querySelectorAll('.fbtn[id^="f-"]').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); render();
}

function setView(v){
  view=v;
  document.getElementById('vl').classList.toggle('on',v==='list');
  document.getElementById('vc').classList.toggle('on',v==='card');
  render();
}

function getFiltered(){
  const raw=document.getElementById('search').value.toLowerCase().trim();
  const sort=document.getElementById('sort').value;
  // Split into words so "secret life" matches "The Secret Life of…"
  const words=raw.split(/\s+/).filter(Boolean);
  let list=[...entries].filter(e=>{
    if(words.length&&!words.every(w=>e.title.toLowerCase().includes(w))) return false;
    if(filter==='watched'&&!e.watched) return false;
    if(filter==='pending'&&e.watched) return false;
    return true;
  });
  if(sort==='alpha') list.sort((a,b)=>a.title.localeCompare(b.title));
  if(sort==='rating') list.sort((a,b)=>(b.rating||0)-(a.rating||0));
  return list;
}

// ── Stats ──────────────────────────────────────────────────────
function updateStats(){
  const w=entries.filter(e=>e.watched).length;
  const l=entries.filter(e=>e.type).length;
  document.getElementById('st').textContent=entries.length;
  document.getElementById('sw').textContent=w;
  document.getElementById('sp').textContent=entries.length-w;
  document.getElementById('sl').textContent=l;
  document.getElementById('prog').style.width=(entries.length?l/entries.length*100:0)+'%';
  const bdb=document.getElementById('bdb');
  bdb.style.display=selIds.size?'block':'none';
  bdb.textContent=`Delete ${selIds.size} selected`;
}

// ── Render ─────────────────────────────────────────────────────
function typeBadge(t){
  if(!t) return '<span class="dash">—</span>';
  const c={'Movie':'t-Movie','Series':'t-Series','Mini-Series':'t-Mini','Anime':'t-Anime','Documentary':'t-Documentary','Reality':'t-Reality'};
  return `<span class="badge ${c[t]||'t-Series'}">${t}</span>`;
}

function posterCell(e){
  return e.poster
    ?`<div class="pw"><img src="${e.poster}" loading="lazy" onerror="this.parentElement.innerHTML='▶'"></div>`
    :`<div class="pw">▶</div>`;
}

function render(){
  const el=document.getElementById('body');
  const list=getFiltered();
  if(!list.length){el.innerHTML='<div class="empty">Nothing here yet.</div>';updateStats();return;}
  const movies=list.filter(e=>e.type==='Movie');
  const tv=list.filter(e=>e.type&&e.type!=='Movie');
  const loading=list.filter(e=>loadingIds.has(e.id));
  const queued=list.filter(e=>!e.type&&!loadingIds.has(e.id));
  el.innerHTML= view==='list'
    ? listSections(movies,tv,loading,queued)
    : cardSections(movies,tv,loading,queued);
  updateStats();
}

// ── LIST ───────────────────────────────────────────────────────
function listSec(label,items){
  if(!items.length) return '';
  return `<div class="sh">${label} <span class="sc">${items.length}</span></div>`
    +`<div class="ch"><div></div><div></div><div>Poster</div><div>Title</div><div>Description</div><div>Type</div><div>Genres</div><div>Runtime</div><div>IMDb</div><div>Actions</div></div>`
    +items.map(listRow).join('');
}
function listSections(mv,tv,ld,qu){
  return listSec('Movies',mv)+listSec('TV &amp; Series',tv)+listSec('Loading…',ld)+listSec('Queued',qu);
}
function listRow(e){
  const sel=selIds.has(e.id), loading=loadingIds.has(e.id);
  const typeCell=loading?`<span class="dot"></span><span class="dot"></span><span class="dot"></span>`:typeBadge(e.type);
  const gnCell=e.genres?.length?`<span class="gn">${e.genres.slice(0,2).join(', ')}</span>`:`<span class="dash">—</span>`;
  const rtCell=e.runtime?`<span class="rt">${e.runtime}</span>`:`<span class="dash">—</span>`;
  const raCell=e.rating?`<div class="rc"><span class="ib">IMDb</span><span class="rn">${e.rating}</span></div>`:`<span class="dash">—</span>`;
  const yr=e.year?`<span class="ty">${e.year}</span>`:'';
  const desc=e.custom_desc||(e.plot&&e.plot!=='N/A'?e.plot:'');
  const descHTML=desc
    ?`<div class="dw"><div class="dt" id="dc-${e.id}">${desc}</div><span class="dm" onclick="toggleDesc(${e.id})">more</span></div>`
    :`<span class="dash">—</span>`;
  return `<div class="lr ${e.watched?'watched':''} ${sel?'sel':''}" id="lr-${e.id}">
    <input type="checkbox" class="cb" ${sel?'checked':''} onchange="toggleSel(${e.id},this.checked)">
    <button class="tog ${e.watched?'on':''}" onclick="toggleWatch(${e.id})">${e.watched?'✓':''}</button>
    ${posterCell(e)}
    <div class="tc"><span class="tn" title="${e.title}">${e.title}</span>${yr}</div>
    <div>${descHTML}</div>
    <div>${typeCell}</div>
    <div>${gnCell}</div>
    <div>${rtCell}</div>
    <div>${raCell}</div>
    <div class="acts">
      <button class="ab" onclick="openEdit(${e.id})" title="Edit">✎</button>
      <button class="ab del" onclick="deleteEntry(${e.id})" title="Delete">✕</button>
    </div>
  </div>`;
}

function toggleDesc(id){
  const el=document.getElementById('dc-'+id);
  const btn=el?.nextElementSibling;
  if(!el) return;
  el.classList.toggle('exp');
  if(btn) btn.textContent=el.classList.contains('exp')?'less':'more';
}

// ── CARD ──────────────────────────────────────────────────────
function cardSec(label,items){
  if(!items.length) return '';
  return `<div class="sh">${label} <span class="sc">${items.length}</span></div>`
    +`<div class="cg">${items.map(cardItem).join('')}</div>`;
}
function cardSections(mv,tv,ld,qu){
  return cardSec('Movies',mv)+cardSec('TV &amp; Series',tv)+cardSec('Loading…',ld)+cardSec('Queued',qu);
}
function cardItem(e){
  const sel=selIds.has(e.id);
  const poster=e.poster
    ?`<img class="cp" src="${e.poster}" loading="lazy" onerror="this.outerHTML='<div class=\\'cp-ph\\'>▶</div>'">`
    :`<div class="cp-ph">▶</div>`;
  return `<div class="ci ${e.watched?'watched':''} ${sel?'sel':''}" id="ci-${e.id}">
    ${poster}
    <input type="checkbox" class="cb2" ${sel?'checked':''} onchange="toggleSel(${e.id},this.checked)">
    <button class="cw ${e.watched?'on':''}" onclick="toggleWatch(${e.id})">${e.watched?'✓':''}</button>
    <div class="ca">
      <button class="cab" onclick="openEdit(${e.id})" title="Edit">✎</button>
      <button class="cab" onclick="deleteEntry(${e.id})" title="Delete" style="color:#ff8080">✕</button>
    </div>
    <div class="cb-body">
      <div class="ct" title="${e.title}">${e.title}</div>
      <div class="cm">${e.year||''}${e.year&&e.rating?' · ':''}<span class="cr">${e.rating||''}</span></div>
    </div>
  </div>`;
}

// ── Selection ─────────────────────────────────────────────────
function toggleSel(id,checked){
  if(checked) selIds.add(id); else selIds.delete(id);
  updateStats();
}

// ── Recommendations ─────────────────────────────────────────────
async function loadRecs(){
  const el=document.getElementById('rec-row');
  if(!curPid) return;
  el.innerHTML='<div class="empty" style="padding:16px 0">Loading recommendations…</div>';
  try{
    const r=await fetch(`/api/profiles/${curPid}/recommendations`,{credentials:'include'});
    const data=await r.json();
    if(!Array.isArray(data)){
      el.innerHTML=`<div class="empty" style="padding:16px 0">${data.error||'Recommendations unavailable — check TMDB_API_KEY is set.'}</div>`;
      return;
    }
    recs=data;
    renderRecs();
  }catch(e){
    el.innerHTML='<div class="empty" style="padding:16px 0">Could not load recommendations.</div>';
  }
}

function renderRecs(){
  const el=document.getElementById('rec-row');
  if(!recs.length){el.innerHTML='<div class="empty" style="padding:16px 0">Nothing to recommend yet — add a few titles and mark some watched.</div>';return;}
  el.innerHTML=recs.map((r,i)=>recCard(r,'addRecommended',i)).join('');
}

function recCard(r,addFnName,i){
  const existing=entries.find(e=>e.title.toLowerCase()===r.title.toLowerCase());
  const inList=!!existing, isWatched=!!(existing&&existing.watched);
  const meta=[r.year,r.type].filter(Boolean).join(' · ')+(r.rating?' · ★'+r.rating:'');
  return `<div class="rec-card">
    ${r.poster?`<img class="cp" src="${r.poster}" loading="lazy" onerror="this.outerHTML='<div class=&quot;cp-ph&quot;>▶</div>'">`:'<div class="cp-ph">▶</div>'}
    <div class="cb-body">
      <div class="ct" title="${r.title}">${r.title}</div>
      <div class="cm">${meta}</div>
      <div class="cplot">${r.plot||''}</div>
      <div style="display:flex;gap:5px;margin-top:6px;">
        <button class="rab ${inList?'added':''}" style="flex:1" onclick="${addFnName}(${i},false)">${inList?'✓ In list':'+ Watchlist'}</button>
        <button class="rab ${isWatched?'added':''}" style="flex:1" onclick="${addFnName}(${i},true)">${isWatched?'✓ Watched':'Watched'}</button>
      </div>
    </div>
  </div>`;
}

async function addFromRecommendation(r, opts={}){
  if(!curPid) return;
  const title=toPC(r.title);
  const existing=entries.find(e=>e.title.toLowerCase()===title.toLowerCase());

  if(existing){
    if(opts.watched && !existing.watched){
      existing.watched=true; render();
      await fetch(`/api/entries/${existing.id}`,{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({watched:true})});
      toast('Marked watched: '+title);
    } else if(!opts.watched){
      dupAlert(`"${title}" is already in this profile!`);
    }
    return;
  }

  const res=await fetch(`/api/profiles/${curPid}/entries`,{
    method:'POST',credentials:'include',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title})
  });
  if(res.status===409){dupAlert(`"${title}" already exists!`);return;}
  const ne=await res.json();
  const patchBody={type:r.type,genres:r.genres||[],rating:r.rating,year:r.year,poster:r.poster,plot:r.plot};
  if(opts.watched) patchBody.watched=true;
  const p=await fetch(`/api/entries/${ne.id}`,{
    method:'PATCH',credentials:'include',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(patchBody)
  });
  entries.push(await p.json());
  render();
  toast(opts.watched?'Added & marked watched: '+title:'Added: '+title);
}

async function addRecommended(i,watched){ await addFromRecommendation(recs[i],{watched}); renderRecs(); }

// ── Watch toggle ──────────────────────────────────────────────
async function toggleWatch(id){
  const e=entries.find(x=>x.id===id); if(!e) return;
  e.watched=!e.watched; render();
  await fetch(`/api/entries/${id}`,{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({watched:e.watched})});
}

// ── Add ──────────────────────────────────────────────────────
async function addTitle(override){
  const inp=document.getElementById('newTitle');
  const raw=(override||inp.value).trim();
  if(!raw||!curPid) return;
  const title=toPC(raw);
  if(entries.find(e=>e.title.toLowerCase()===title.toLowerCase())){
    dupAlert(`"${title}" is already in this profile!`); return;
  }
  const r=await fetch(`/api/profiles/${curPid}/entries`,{
    method:'POST',credentials:'include',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title})
  });
  if(r.status===409){dupAlert(`"${title}" already exists!`);return;}
  const ne=await r.json();
  entries.push(ne);
  inp.value=''; hideSug(); render();
  toast('Added: '+title);
  fetchAndSave(ne);
}

// ── Delete ────────────────────────────────────────────────────
async function deleteEntry(id){
  if(!confirm('Remove this title?')) return;
  await fetch(`/api/entries/${id}`,{method:'DELETE',credentials:'include'});
  entries=entries.filter(e=>e.id!==id); selIds.delete(id); render();
}

async function bulkDelete(){
  const ids=[...selIds];
  if(!ids.length) return;
  if(!confirm(`Delete ${ids.length} title${ids.length>1?'s':''}?`)) return;
  await fetch('/api/entries/bulk-delete',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});
  entries=entries.filter(e=>!selIds.has(e.id)); selIds.clear(); render();
  toast(`Deleted ${ids.length} title${ids.length>1?'s':''}`);
}

// ── Bulk Add ─────────────────────────────────────────────────
function openBulkAdd(){
  document.getElementById('ba-text').value='';
  document.getElementById('ba-status').textContent='';
  document.getElementById('ba-btn').disabled=false;
  document.getElementById('ba-btn').textContent='Import';
  document.getElementById('bamod').classList.add('open');
  setTimeout(()=>document.getElementById('ba-text').focus(),80);
}

async function runBulkAdd(){
  if(!curPid) return;
  const raw=document.getElementById('ba-text').value;
  const titles=[...new Set(
    raw.split('\n')
      .map(l=>l.trim())
      .filter(l=>l.length>0)
      .map(l=>toPC(l))
  )];
  if(!titles.length){ document.getElementById('ba-status').textContent='No titles found.'; return; }

  const btn=document.getElementById('ba-btn');
  btn.disabled=true;
  const status=document.getElementById('ba-status');

  let added=[], skipped=[], failed=[];

  for(let i=0;i<titles.length;i++){
    const title=titles[i];
    status.textContent=`Adding ${i+1} of ${titles.length}: ${title}…`;

    // Skip if already in local list
    if(entries.find(e=>e.title.toLowerCase()===title.toLowerCase())){
      skipped.push(title); continue;
    }
    try{
      const r=await fetch(`/api/profiles/${curPid}/entries`,{
        method:'POST',credentials:'include',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({title})
      });
      if(r.status===409){ skipped.push(title); continue; }
      if(!r.ok){ failed.push(title); continue; }
      const ne=await r.json();
      entries.push(ne);
      added.push(ne);
    }catch(e){ failed.push(title); }
  }

  // Kick off OMDB fetches in background (non-blocking)
  added.forEach(e=>fetchAndSave(e));
  render();

  // Show summary
  let summary=[];
  if(added.length)   summary.push(`<span style="color:var(--green)">✓ ${added.length} added</span>`);
  if(skipped.length) summary.push(`<span style="color:var(--muted)">— ${skipped.length} already existed</span>`);
  if(failed.length)  summary.push(`<span style="color:var(--red)">✗ ${failed.length} failed</span>`);
  status.innerHTML=summary.join(' &nbsp;·&nbsp; ');

  btn.textContent='Done';
  // Auto-close after 2s if all went well
  if(!failed.length) setTimeout(()=>closeModal('bamod'),2000);
}

// ── Edit ──────────────────────────────────────────────────────
function openEdit(id){
  const e=entries.find(x=>x.id===id); if(!e) return;
  editId=id;
  document.getElementById('e-t').value=e.title;
  document.getElementById('e-d').value=e.custom_desc||(e.plot&&e.plot!=='N/A'?e.plot:'')||'';
  document.getElementById('e-ty').value=e.type||'Series';
  document.getElementById('e-g').value=(e.genres||[]).join(', ');
  document.getElementById('e-r').value=e.runtime||'';
  document.getElementById('e-i').value=e.rating||'';
  document.getElementById('emod').classList.add('open');
}

async function saveEdit(){
  if(!editId) return;
  const title=toPC(document.getElementById('e-t').value.trim());
  const custom_desc=document.getElementById('e-d').value.trim();
  const type=document.getElementById('e-ty').value;
  const genres=document.getElementById('e-g').value.split(',').map(g=>g.trim()).filter(Boolean);
  const runtime=document.getElementById('e-r').value.trim();
  const rating=parseFloat(document.getElementById('e-i').value)||null;
  const r=await fetch(`/api/entries/${editId}`,{
    method:'PATCH',credentials:'include',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title,custom_desc,type,genres,runtime,rating})
  });
  const updated=await r.json();
  const idx=entries.findIndex(e=>e.id===editId);
  if(idx!==-1) entries[idx]=updated;
  closeModal('emod'); render();
}

function closeModal(id){
  document.getElementById(id).classList.remove('open');
  if(id==='emod') editId=null;
}
document.querySelectorAll('.mo').forEach(m=>m.addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');}));

// ── Toasts / alerts ───────────────────────────────────────────
function toast(msg,ms=3000){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',ms);}
function dupAlert(msg,ms=3500){const el=document.getElementById('dup-alert');el.textContent=msg;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',ms);}

// ── Autocomplete ──────────────────────────────────────────────
function hideSug(){document.getElementById('sug').style.display='none';sugItems=[];sugIdx=-1;}

async function onAddInput(){
  const inp=document.getElementById('newTitle');
  const q=inp.value;  // no toPC here — applied only on Add/submit so typing spaces works freely
  clearTimeout(sugT);
  if(q.trim().length<2){hideSug();return;}
  sugT=setTimeout(async()=>{
    try{
      const r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({query:q.trim()})});
      if(!r.ok){hideSug();return;}
      renderSug(await r.json(),inp);
    }catch(e){hideSug();}
  },300);
}

function renderSug(items,inp){
  const el=document.getElementById('sug');
  if(!items?.length){hideSug();return;}
  sugItems=items; sugIdx=-1;
  el.innerHTML=items.map((item,i)=>`
    <div class="si" onmousedown="pickSug(${i})">
      ${item.poster?`<img src="${item.poster}" onerror="this.style.display='none'">`:'<div style="width:26px;height:38px;background:var(--border);border-radius:2px;flex-shrink:0"></div>'}
      <div><div>${item.title}</div><div class="si-meta">${[item.year,item.type].filter(Boolean).join(' · ')}</div></div>
    </div>`).join('');
  const rect=inp.getBoundingClientRect();
  // Use fixed positioning so dropdown is always visible without scrolling
  el.style.position='fixed';
  el.style.top=(rect.bottom+4)+'px';
  el.style.left=rect.left+'px';
  el.style.width=Math.max(inp.offsetWidth,260)+'px';
  el.style.display='block';
}

function pickSug(i){const item=sugItems[i];if(!item) return;document.getElementById('newTitle').value=item.title;hideSug();}

function onAddKey(e){
  const items=document.getElementById('sug').querySelectorAll('.si');
  if(e.key==='ArrowDown'){sugIdx=Math.min(sugIdx+1,items.length-1);items.forEach((x,i)=>x.classList.toggle('active',i===sugIdx));e.preventDefault();}
  else if(e.key==='ArrowUp'){sugIdx=Math.max(sugIdx-1,-1);items.forEach((x,i)=>x.classList.toggle('active',i===sugIdx));e.preventDefault();}
  else if(e.key==='Enter'){if(sugIdx>=0&&sugItems[sugIdx])pickSug(sugIdx);else addTitle();}
  else if(e.key==='Escape')hideSug();
}
document.addEventListener('click',e=>{if(!document.getElementById('newTitle').contains(e.target))hideSug();});

// ── OMDB fetch ────────────────────────────────────────────────
async function fetchAndSave(entry){
  loadingIds.add(entry.id); render();
  try{
    const r=await fetch('/api/fetch-info',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:entry.title})});
    const data=await r.json();
    if(data.found){
      const p=await fetch(`/api/entries/${entry.id}`,{
        method:'PATCH',credentials:'include',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({type:data.type,genres:data.genres,runtime:data.runtime,rating:data.rating,year:data.year,poster:data.poster,plot:data.plot})
      });
      const updated=await p.json();
      const idx=entries.findIndex(e=>e.id===entry.id);
      if(idx!==-1) entries[idx]=updated;
    }
  }catch(e){}
  loadingIds.delete(entry.id); render();
}

async function refetchAll(){
  const fab=document.getElementById('fab'); fab.disabled=true; fab.textContent='Loading…';
  for(const e of [...entries]) await fetchAndSave(e);
  fab.disabled=false; fab.textContent='Reload info';
}

// ── Logout ────────────────────────────────────────────────────
async function doLogout(){
  await fetch('/api/logout',{method:'POST',credentials:'include'});
  window.location.href='/';
}

// ── Start ─────────────────────────────────────────────────────
init();
</script>
