<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Watchlist</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#0d0d14;--surface:#111118;--border:#1e1e2a;--border-light:#14141c;
    --text:#e0ddd6;--muted:#666;--dim:#2e2e3a;
    --gold:#c8971a;--gold-l:#f5c518;--green:#4caf50;--red:#e53935;
  }
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh;}

  /* ── Dup alert ── */
  #dup-alert{display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:var(--red);color:#fff;font-size:16px;font-weight:500;padding:16px 24px;text-align:center;animation:slideDown 0.2s ease;}
  @keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}

  /* ── Header ── */
  .header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;color:var(--gold-l);line-height:1;flex-shrink:0;}
  .logo span{color:var(--text);}

  /* Profile selector */
  .profile-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .profile-chip{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
  .profile-chip.on{background:var(--gold);color:#0d0d14;border-color:var(--gold);font-weight:500;}
  .profile-chip.add-chip{border-style:dashed;}
  .profile-chip.add-chip:hover{border-color:var(--gold);color:var(--gold);}
  .del-profile{background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;margin-left:2px;padding:0 2px;}
  .del-profile:hover{color:var(--red);}

  .header-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .username-badge{font-size:12px;color:var(--muted);}
  .logout-btn{padding:5px 12px;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;}
  .logout-btn:hover{border-color:var(--red);color:var(--red);}

  .stats{display:flex;gap:8px;flex-wrap:wrap;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:4px 12px;text-align:center;}
  .stat-n{font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1;}
  .stat-n.gold{color:var(--gold);}
  .stat-n.green{color:var(--green);}
  .stat-l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}

  .prog-wrap{height:2px;background:var(--border);}
  .prog-bar{height:100%;background:var(--gold);transition:width 0.4s;width:0%;}

  /* ── Controls ── */
  .controls{padding:10px 24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;background:var(--bg);}
  input[type=text]{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:7px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color 0.2s;}
  input[type=text]:focus{border-color:var(--gold);}
  input[type=text]::placeholder{color:var(--dim);}
  select{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:7px 10px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;outline:none;cursor:pointer;}
  .fbtn{padding:7px 14px;border-radius:3px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all 0.15s;}
  .fbtn.on{background:var(--gold);color:#0d0d14;border-color:var(--gold);font-weight:500;}
  .gold-btn{padding:7px 16px;background:var(--gold);color:#0d0d14;border:none;border-radius:3px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;cursor:pointer;transition:opacity 0.2s;white-space:nowrap;}
  .gold-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .red-btn{padding:7px 14px;background:var(--red);color:#fff;border:none;border-radius:3px;font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;display:none;}

  /* View toggle */
  .view-btn{width:30px;height:30px;border-radius:3px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all 0.15s;}
  .view-btn.on{border-color:var(--gold);color:var(--gold);}

  /* Autocomplete */
  #suggestions{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:3px;z-index:500;display:none;min-width:240px;max-height:260px;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,.6);}
  .sug-item{padding:8px 12px;cursor:pointer;font-size:13px;color:var(--text);border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:10px;}
  .sug-item:last-child{border-bottom:none;}
  .sug-item:hover,.sug-item.active{background:var(--border);}
  .sug-poster{width:26px;height:38px;object-fit:cover;border-radius:2px;flex-shrink:0;background:var(--border);}
  .sug-meta{font-size:11px;color:var(--muted);margin-top:2px;}

  /* ── LIST VIEW ── */
  .section-head{padding:10px 24px 7px;font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
  .section-count{font-weight:400;color:var(--dim);}

  .col-head{display:grid;grid-template-columns:20px 28px 44px 190px minmax(0,1fr) 90px minmax(0,130px) 70px 70px 60px;gap:10px;padding:6px 24px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);border-bottom:1px solid var(--border-light);}
  .row{display:grid;grid-template-columns:20px 28px 44px 190px minmax(0,1fr) 90px minmax(0,130px) 70px 70px 60px;gap:10px;padding:5px 24px;border-bottom:1px solid var(--border-light);align-items:start;transition:background .1s;}
  .row:hover{background:var(--surface);}
  .row.watched{border-left:2px solid var(--green);padding-left:22px;}
  .row.selected{background:#1a1a0a;}

  .cb{width:14px;height:14px;accent-color:var(--gold);cursor:pointer;margin-top:5px;flex-shrink:0;}
  .toggle{width:20px;height:20px;border-radius:50%;border:1.5px solid #333;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;transition:all .15s;flex-shrink:0;margin-top:3px;}
  .toggle.on{background:var(--green);border-color:var(--green);}
  .toggle:hover{border-color:var(--green);}
  .poster-wrap{width:32px;height:46px;flex-shrink:0;border-radius:2px;overflow:hidden;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--dim);}
  .poster-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .title-cell{font-size:13px;font-weight:500;line-height:1.35;overflow:hidden;padding-top:2px;}
  .title-name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .title-year{font-size:11px;color:var(--muted);font-weight:300;display:block;}
  .desc-wrap{padding-top:2px;min-width:0;}
  .desc-text{font-size:11px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .desc-text.exp{display:block;}
  .desc-more{font-size:10px;color:var(--gold);cursor:pointer;margin-top:2px;display:inline-block;}
  .badge{font-size:10px;padding:2px 7px;border-radius:2px;display:inline-block;margin-top:4px;}
  .t-Movie{background:#1a2010;color:#88aa44;}
  .t-Series{background:#1e1e2e;color:#8888cc;}
  .t-Mini{background:#1e1a2a;color:#9977cc;}
  .t-Anime{background:#2a1e10;color:#cc8833;}
  .t-Documentary{background:#0f2a1a;color:#44aa66;}
  .t-Reality{background:#2a1028;color:#bb55cc;}
  .genres{font-size:11px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-top:4px;}
  .runtime{font-size:12px;color:var(--muted);padding-top:4px;}
  .rating-cell{display:flex;align-items:center;gap:4px;padding-top:4px;}
  .imdb-b{background:var(--gold-l);color:#000;font-size:9px;font-weight:700;padding:1px 4px;border-radius:2px;}
  .rating-n{font-size:13px;font-weight:500;color:var(--gold);}
  .dash{color:var(--dim);font-size:12px;padding-top:4px;display:block;}
  .actions{display:flex;gap:4px;align-items:center;padding-top:2px;}
  .act-btn{width:26px;height:26px;border-radius:3px;border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;color:var(--muted);}
  .act-btn:hover{border-color:var(--gold);color:var(--gold);}
  .act-btn.del:hover{border-color:var(--red);color:var(--red);}

  /* ── CARD VIEW ── */
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;padding:20px 24px;}
  .card-section-head{padding:14px 24px 4px;font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
  .card-item{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;position:relative;transition:transform .15s,border-color .15s;cursor:default;}
  .card-item:hover{transform:translateY(-2px);border-color:#2e2e4e;}
  .card-item.watched{border-left:3px solid var(--green);}
  .card-item.selected{border-color:var(--gold);}
  .card-poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--dim);}
  .card-poster-ph{width:100%;aspect-ratio:2/3;background:#1a1a28;display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--dim);}
  .card-body{padding:8px 10px;}
  .card-title{font-size:12px;font-weight:500;line-height:1.3;margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .card-meta{font-size:10px;color:var(--muted);}
  .card-rating{font-size:11px;color:var(--gold);font-weight:500;}
  .card-actions{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:4px;opacity:0;transition:opacity .15s;}
  .card-item:hover .card-actions{opacity:1;}
  .card-cb{position:absolute;top:6px;left:6px;}
  .card-watch{position:absolute;bottom:60px;right:6px;width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);background:rgba(0,0,0,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;transition:all .15s;}
  .card-watch.on{background:var(--green);border-color:var(--green);}
  .card-act{width:24px;height:24px;border-radius:3px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.7);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:all .15s;}
  .card-act:hover{background:rgba(0,0,0,.9);}

  /* ── Dots loader ── */
  .dot{width:4px;height:4px;background:var(--gold);border-radius:50%;display:inline-block;animation:blink .8s infinite;margin:0 1px;}
  .dot:nth-child(2){animation-delay:.2s;}
  .dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}

  .empty{padding:50px 24px;text-align:center;color:var(--muted);font-size:13px;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:12px;padding:8px 16px;border-radius:4px;display:none;z-index:100;}

  /* ── Modal ── */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:24px;width:440px;max-width:95vw;}
  .modal h3{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;margin-bottom:16px;color:var(--gold-l);}
  .modal label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-top:12px;margin-bottom:4px;}
  .modal input,.modal textarea,.modal select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:7px 10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;}
  .modal textarea{resize:vertical;min-height:90px;line-height:1.5;}
  .modal input:focus,.modal textarea:focus{border-color:var(--gold);}
  .modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
  .modal-btns button{padding:7px 18px;border-radius:3px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--muted);}
  .modal-btns .save-btn{background:var(--gold);color:#0d0d14;border-color:var(--gold);font-weight:500;}
</style>
</head>
<body>

<div id="dup-alert"></div>

<div class="header">
  <div class="logo">My <span>Watchlist</span></div>
  <div class="profile-bar" id="profile-bar"></div>
  <div class="header-right">
    <div class="stats">
      <div class="stat"><div class="stat-n" id="s-total">0</div><div class="stat-l">Total</div></div>
      <div class="stat"><div class="stat-n green" id="s-watched">0</div><div class="stat-l">Watched</div></div>
      <div class="stat"><div class="stat-n" id="s-pending">0</div><div class="stat-l">Pending</div></div>
      <div class="stat"><div class="stat-n gold" id="s-loaded">0</div><div class="stat-l">Loaded</div></div>
    </div>
    <span class="username-badge" id="username-badge"></span>
    <button class="logout-btn" onclick="doLogout()">Sign out</button>
  </div>
</div>
<div class="prog-wrap"><div class="prog-bar" id="prog"></div></div>

<div class="controls">
  <input type="text" id="search" placeholder="Search…" style="width:160px;" oninput="render()">
  <input type="text" id="newTitle" placeholder="Add title…" style="width:200px;"
    oninput="onAddInput()" onkeydown="onAddKey(event)" autocomplete="off">
  <button class="fbtn" onclick="addTitle()">Add</button>
  <button class="fbtn on" id="f-pending" onclick="setFilter('pending',this)">Pending</button>
  <button class="fbtn" id="f-all" onclick="setFilter('all',this)">All</button>
  <button class="fbtn" id="f-watched" onclick="setFilter('watched',this)">Watched</button>
  <select id="sort" onchange="render()">
    <option value="default">Default</option>
    <option value="alpha">A – Z</option>
    <option value="rating">Top rated</option>
  </select>
  <button class="view-btn on" id="vlist" onclick="setView('list')" title="List view">☰</button>
  <button class="view-btn" id="vcard" onclick="setView('card')" title="Card view">⊞</button>
  <button class="red-btn" id="bulk-del-btn" onclick="bulkDelete()">Delete selected</button>
  <button class="gold-btn" id="fab" onclick="refetchAll()">Reload info</button>
</div>

<div id="suggestions"></div>
<div id="body"></div>
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Edit Entry</h3>
    <label>Title</label><input type="text" id="e-title">
    <label>Description</label><textarea id="e-desc" placeholder="Brief description…"></textarea>
    <label>Type</label>
    <select id="e-type"><option>Movie</option><option>Series</option><option>Mini-Series</option><option>Anime</option><option>Documentary</option><option>Reality</option></select>
    <label>Genres (comma separated)</label><input type="text" id="e-genres">
    <label>Runtime</label><input type="text" id="e-runtime">
    <label>IMDb Rating</label><input type="text" id="e-rating">
    <div class="modal-btns">
      <button onclick="closeModal()">Cancel</button>
      <button class="save-btn" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="new-profile-modal">
  <div class="modal">
    <h3>New Profile</h3>
    <label>Profile name</label>
    <input type="text" id="np-name" placeholder="e.g. Kids, Work, Partner…" onkeydown="if(event.key==='Enter')saveNewProfile()">
    <div class="modal-btns">
      <button onclick="document.getElementById('new-profile-modal').classList.remove('open')">Cancel</button>
      <button class="save-btn" onclick="saveNewProfile()">Create</button>
    </div>
  </div>
</div>

<script>
// ── Helpers ──
function toProperCase(s){
  const m=new Set(['a','an','the','and','but','or','for','nor','on','at','to','by','in','of','up','as','is','it','vs']);
  return s.trim().replace(/\s+/g,' ').split(' ').map((w,i)=>{const l=w.toLowerCase();return(i&&m.has(l))?l:w[0].toUpperCase()+w.slice(1);}).join(' ');
}

// ── State ──
let profiles=[], currentProfileId=null, entries=[], loadingIds=new Set();
let activeFilter='pending', viewMode='list', editTarget=null;
let selectedIds=new Set();
let sugTimeout=null, sugItems=[], sugIdx=-1;

// ── Init ──
async function init(){
  const res=await fetch('/api/me',{credentials:'include'});
  const me=await res.json();
  if(!me.authenticated){ window.location.href='/'; return; }
  document.getElementById('username-badge').textContent=me.username;
  profiles=me.profiles;
  if(profiles.length) await selectProfile(profiles[0].id);
  renderProfileBar();
}

// ── Profiles ──
function renderProfileBar(){
  const bar=document.getElementById('profile-bar');
  bar.innerHTML=profiles.map(p=>`
    <div class="profile-chip ${p.id===currentProfileId?'on':''}" onclick="selectProfile(${p.id})">
      ${p.name}
      ${profiles.length>1?`<button class="del-profile" onclick="event.stopPropagation();deleteProfile(${p.id})" title="Delete profile">✕</button>`:''}
    </div>`).join('')
  +`<div class="profile-chip add-chip" onclick="document.getElementById('new-profile-modal').classList.add('open')">+ New profile</div>`;
}

async function selectProfile(id){
  currentProfileId=id;
  selectedIds.clear();
  const res=await fetch(`/api/profiles/${id}/entries`,{credentials:'include'});
  entries=await res.json();
  renderProfileBar();
  render();
  // fetch missing info
  const missing=entries.filter(e=>!e.type&&!loadingIds.has(e.id));
  if(missing.length) fetchMissing(missing);
}

async function saveNewProfile(){
  const name=document.getElementById('np-name').value.trim();
  if(!name) return;
  const res=await fetch('/api/profiles',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
  const p=await res.json();
  profiles.push(p);
  document.getElementById('new-profile-modal').classList.remove('open');
  document.getElementById('np-name').value='';
  await selectProfile(p.id);
}

async function deleteProfile(id){
  if(!confirm('Delete this profile and all its entries?')) return;
  await fetch(`/api/profiles/${id}`,{method:'DELETE',credentials:'include'});
  profiles=profiles.filter(p=>p.id!==id);
  if(currentProfileId===id && profiles.length) await selectProfile(profiles[0].id);
  else renderProfileBar();
}

// ── Render ──
function isMovie(e){ return e.type==='Movie'; }

function getFiltered(){
  const q=document.getElementById('search').value.toLowerCase();
  const sort=document.getElementById('sort').value;
  let list=[...entries].filter(e=>{
    if(q && !e.title.toLowerCase().includes(q)) return false;
    if(activeFilter==='watched' && !e.watched) return false;
    if(activeFilter==='pending' && e.watched) return false;
    return true;
  });
  if(sort==='alpha') list.sort((a,b)=>a.title.localeCompare(b.title));
  if(sort==='rating') list.sort((a,b)=>(b.rating||0)-(a.rating||0));
  return list;
}

function updateStats(){
  const watched=entries.filter(e=>e.watched).length;
  const loaded=entries.filter(e=>e.type).length;
  document.getElementById('s-total').textContent=entries.length;
  document.getElementById('s-watched').textContent=watched;
  document.getElementById('s-pending').textContent=entries.length-watched;
  document.getElementById('s-loaded').textContent=loaded;
  document.getElementById('prog').style.width=(entries.length?loaded/entries.length*100:0)+'%';
  const bulkBtn=document.getElementById('bulk-del-btn');
  bulkBtn.style.display=selectedIds.size?'block':'none';
  bulkBtn.textContent=`Delete ${selectedIds.size} selected`;
}

function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.fbtn[id^="f-"]').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); render();
}

function setView(v){
  viewMode=v;
  document.getElementById('vlist').classList.toggle('on',v==='list');
  document.getElementById('vcard').classList.toggle('on',v==='card');
  render();
}

function typeBadge(type){
  if(!type) return '<span class="dash">—</span>';
  const cls={'Movie':'t-Movie','Series':'t-Series','Mini-Series':'t-Mini','Anime':'t-Anime','Documentary':'t-Documentary','Reality':'t-Reality'};
  return `<span class="badge ${cls[type]||'t-Series'}">${type}</span>`;
}

function render(){
  const el=document.getElementById('body');
  const list=getFiltered();
  if(!list.length){el.innerHTML='<div class="empty">No titles here yet.</div>';updateStats();return;}
  const movies=list.filter(e=>isMovie(e));
  const tv=list.filter(e=>e.type&&!isMovie(e));
  const loading=list.filter(e=>loadingIds.has(e.id));
  const queued=list.filter(e=>!e.type&&!loadingIds.has(e.id));
  if(viewMode==='card') el.innerHTML=renderCardSections(movies,tv,loading,queued);
  else el.innerHTML=renderListSections(movies,tv,loading,queued);
  updateStats();
}

// ── LIST ──
function listSection(label,items){
  if(!items.length) return '';
  return `<div class="section-head">${label} <span class="section-count">${items.length}</span></div>
    <div class="col-head"><div></div><div></div><div>Poster</div><div>Title</div><div>Description</div><div>Type</div><div>Genres</div><div>Runtime</div><div>IMDb</div><div>Actions</div></div>`
    +items.map(listRow).join('');
}
function renderListSections(movies,tv,loading,queued){
  return listSection('Movies',movies)+listSection('TV &amp; Series',tv)+listSection('Loading…',loading)+listSection('Queued',queued);
}
function listRow(e){
  const eid=e.id; const loading=loadingIds.has(eid); const sel=selectedIds.has(eid);
  const posterHTML=e.poster?`<div class="poster-wrap"><img src="${e.poster}" loading="lazy" onerror="this.parentElement.innerHTML='▶'"></div>`:`<div class="poster-wrap">▶</div>`;
  const typeCell=loading?`<span class="dot"></span><span class="dot"></span><span class="dot"></span>`:typeBadge(e.type);
  const genreCell=e.genres?.length?`<span class="genres">${e.genres.slice(0,2).join(', ')}</span>`:`<span class="dash">—</span>`;
  const rtCell=e.runtime?`<span class="runtime">${e.runtime}</span>`:`<span class="dash">—</span>`;
  const ratingCell=e.rating?`<div class="rating-cell"><span class="imdb-b">IMDb</span><span class="rating-n">${e.rating}</span></div>`:`<span class="dash">—</span>`;
  const yr=e.year?`<span class="title-year">${e.year}</span>`:'';
  const desc=e.custom_desc||(e.plot&&e.plot!=='N/A'?e.plot:'');
  const descHTML=desc?`<div class="desc-wrap"><div class="desc-text" id="dc-${eid}">${desc}</div><span class="desc-more" onclick="toggleDesc(${eid})">more</span></div>`:`<span class="dash">—</span>`;
  return `<div class="row ${e.watched?'watched':''} ${sel?'selected':''}" id="row-${eid}">
    <input type="checkbox" class="cb" ${sel?'checked':''} onchange="toggleSel(${eid},this.checked)">
    <button class="toggle ${e.watched?'on':''}" onclick="toggleWatch(${eid})">${e.watched?'✓':''}</button>
    ${posterHTML}
    <div class="title-cell"><span class="title-name" title="${e.title}">${e.title}</span>${yr}</div>
    <div>${descHTML}</div>
    <div>${typeCell}</div>
    <div>${genreCell}</div>
    <div>${rtCell}</div>
    <div>${ratingCell}</div>
    <div class="actions">
      <button class="act-btn" title="Edit" onclick="openEdit(${eid})">✎</button>
      <button class="act-btn del" title="Delete" onclick="deleteEntry(${eid})">✕</button>
    </div>
  </div>`;
}

// ── CARD ──
function renderCardSections(movies,tv,loading,queued){
  let h='';
  if(movies.length) h+=`<div class="card-section-head">Movies</div><div class="card-grid">${movies.map(cardItem).join('')}</div>`;
  if(tv.length)     h+=`<div class="card-section-head">TV &amp; Series</div><div class="card-grid">${tv.map(cardItem).join('')}</div>`;
  if(loading.length)h+=`<div class="card-section-head">Loading…</div><div class="card-grid">${loading.map(cardItem).join('')}</div>`;
  if(queued.length) h+=`<div class="card-section-head">Queued</div><div class="card-grid">${queued.map(cardItem).join('')}</div>`;
  return h;
}
function cardItem(e){
  const sel=selectedIds.has(e.id);
  const posterHTML=e.poster
    ?`<img class="card-poster" src="${e.poster}" loading="lazy" onerror="this.outerHTML='<div class=\\'card-poster-ph\\'>▶</div>'">`
    :`<div class="card-poster-ph">▶</div>`;
  return `<div class="card-item ${e.watched?'watched':''} ${sel?'selected':''}" id="card-${e.id}">
    ${posterHTML}
    <input type="checkbox" class="cb card-cb" ${sel?'checked':''} onchange="toggleSel(${e.id},this.checked)" title="Select">
    <button class="card-watch ${e.watched?'on':''}" onclick="toggleWatch(${e.id})" title="${e.watched?'Mark pending':'Mark watched'}">${e.watched?'✓':''}</button>
    <div class="card-actions">
      <button class="card-act" title="Edit" onclick="openEdit(${e.id})">✎</button>
      <button class="card-act" title="Delete" onclick="deleteEntry(${e.id})" style="color:#ff6b6b">✕</button>
    </div>
    <div class="card-body">
      <div class="card-title" title="${e.title}">${e.title}</div>
      <div class="card-meta">${e.year||''}${e.year&&e.rating?' · ':''}<span class="card-rating">${e.rating||''}</span></div>
    </div>
  </div>`;
}

function toggleDesc(eid){
  const el=document.getElementById('dc-'+eid);
  const btn=el?.nextElementSibling;
  if(!el) return;
  el.classList.toggle('exp');
  if(btn) btn.textContent=el.classList.contains('exp')?'less':'more';
}

function toggleSel(id,checked){
  if(checked) selectedIds.add(id); else selectedIds.delete(id);
  updateStats();
}

// ── Watch toggle ──
async function toggleWatch(eid){
  const entry=entries.find(e=>e.id===eid);
  if(!entry) return;
  entry.watched=!entry.watched;
  render();
  await fetch(`/api/entries/${eid}`,{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({watched:entry.watched})});
}

// ── Add ──
async function addTitle(override){
  const input=document.getElementById('newTitle');
  const raw=(override||input.value).trim();
  if(!raw||!currentProfileId) return;
  const title=toProperCase(raw);
  const dupe=entries.find(e=>e.title.toLowerCase()===title.toLowerCase());
  if(dupe){ dupAlert(`"${dupe.title}" is already in this profile!`); return; }

  // First add to DB, then fetch OMDB info
  const res=await fetch(`/api/profiles/${currentProfileId}/entries`,{
    method:'POST',credentials:'include',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title})
  });
  if(res.status===409){ dupAlert(`"${title}" is already in this profile!`); return; }
  const newEntry=await res.json();
  entries.push(newEntry);
  input.value=''; hideSug(); render();
  toast('Added: '+title);
  // fetch OMDB info
  fetchAndSave(newEntry);
}

// ── Delete ──
async function deleteEntry(eid){
  if(!confirm('Remove this title from your watchlist?')) return;
  await fetch(`/api/entries/${eid}`,{method:'DELETE',credentials:'include'});
  entries=entries.filter(e=>e.id!==eid);
  selectedIds.delete(eid);
  render();
}

async function bulkDelete(){
  const ids=[...selectedIds];
  if(!ids.length) return;
  if(!confirm(`Delete ${ids.length} selected title${ids.length>1?'s':''}?`)) return;
  await fetch('/api/entries/bulk-delete',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});
  entries=entries.filter(e=>!selectedIds.has(e.id));
  selectedIds.clear();
  render();
  toast(`Deleted ${ids.length} title${ids.length>1?'s':''}`);
}

// ── Edit modal ──
function openEdit(eid){
  const e=entries.find(x=>x.id===eid); if(!e) return;
  editTarget=eid;
  document.getElementById('e-title').value=e.title;
  document.getElementById('e-desc').value=e.custom_desc||(e.plot&&e.plot!=='N/A'?e.plot:'')||'';
  document.getElementById('e-type').value=e.type||'Series';
  document.getElementById('e-genres').value=(e.genres||[]).join(', ');
  document.getElementById('e-runtime').value=e.runtime||'';
  document.getElementById('e-rating').value=e.rating||'';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); editTarget=null; }
async function saveEdit(){
  if(!editTarget) return;
  const title=toProperCase(document.getElementById('e-title').value.trim());
  const custom_desc=document.getElementById('e-desc').value.trim();
  const type=document.getElementById('e-type').value;
  const genres=document.getElementById('e-genres').value.split(',').map(g=>g.trim()).filter(Boolean);
  const runtime=document.getElementById('e-runtime').value.trim();
  const rating=parseFloat(document.getElementById('e-rating').value)||null;
  const res=await fetch(`/api/entries/${editTarget}`,{
    method:'PATCH',credentials:'include',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title,custom_desc,type,genres,runtime,rating})
  });
  const updated=await res.json();
  const idx=entries.findIndex(e=>e.id===editTarget);
  if(idx!==-1) entries[idx]=updated;
  closeModal(); render();
}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.getElementById('new-profile-modal').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});

// ── Toast / alerts ──
function toast(msg,ms=3000){ const el=document.getElementById('toast'); el.textContent=msg; el.style.display='block'; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',ms); }
function dupAlert(msg,ms=3500){ const el=document.getElementById('dup-alert'); el.textContent=msg; el.style.display='block'; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',ms); }

// ── Autocomplete ──
function hideSug(){ document.getElementById('suggestions').style.display='none'; sugItems=[]; sugIdx=-1; }

async function onAddInput(){
  const input=document.getElementById('newTitle');
  let q=input.value;
  if(q){ const pc=toProperCase(q); if(pc!==q){ const p=input.selectionStart; input.value=pc; try{input.setSelectionRange(p,p);}catch(e){} } }
  clearTimeout(sugTimeout);
  if(q.trim().length<2){ hideSug(); return; }
  sugTimeout=setTimeout(async()=>{
    try{
      const res=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({query:q.trim()})});
      if(!res.ok){ hideSug(); return; }
      renderSug(await res.json(),input);
    }catch(e){ hideSug(); }
  },300);
}

function renderSug(items,input){
  const el=document.getElementById('suggestions');
  if(!items||!items.length){ hideSug(); return; }
  sugItems=items; sugIdx=-1;
  el.innerHTML=items.map((item,i)=>`
    <div class="sug-item" onmousedown="pickSug(${i})">
      ${item.poster?`<img class="sug-poster" src="${item.poster}" onerror="this.style.display='none'">`:'<div style="width:26px;height:38px;background:var(--border);border-radius:2px;flex-shrink:0;"></div>'}
      <div><div>${item.title}</div><div class="sug-meta">${[item.year,item.type].filter(Boolean).join(' · ')}</div></div>
    </div>`).join('');
  const rect=input.getBoundingClientRect();
  el.style.top=(rect.bottom+window.scrollY+4)+'px';
  el.style.left=rect.left+'px';
  el.style.width=Math.max(input.offsetWidth,260)+'px';
  el.style.display='block';
}
function pickSug(i){ const item=sugItems[i]; if(!item) return; document.getElementById('newTitle').value=item.title; hideSug(); }
function onAddKey(e){
  const items=document.getElementById('suggestions').querySelectorAll('.sug-item');
  if(e.key==='ArrowDown'){ sugIdx=Math.min(sugIdx+1,items.length-1); items.forEach((x,i)=>x.classList.toggle('active',i===sugIdx)); e.preventDefault(); }
  else if(e.key==='ArrowUp'){ sugIdx=Math.max(sugIdx-1,-1); items.forEach((x,i)=>x.classList.toggle('active',i===sugIdx)); e.preventDefault(); }
  else if(e.key==='Enter'){ if(sugIdx>=0&&sugItems[sugIdx]) pickSug(sugIdx); else addTitle(); }
  else if(e.key==='Escape') hideSug();
}
document.addEventListener('click',e=>{ if(!document.getElementById('newTitle').contains(e.target)) hideSug(); });

// ── OMDB fetch ──
async function fetchAndSave(entry){
  loadingIds.add(entry.id); render();
  try{
    const res=await fetch('/api/fetch-info',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:entry.title})});
    const data=await res.json();
    if(data.found){
      const patch=await fetch(`/api/entries/${entry.id}`,{
        method:'PATCH',credentials:'include',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({type:data.type,genres:data.genres,runtime:data.runtime,rating:data.rating,year:data.year,poster:data.poster,plot:data.plot})
      });
      const updated=await patch.json();
      const idx=entries.findIndex(e=>e.id===entry.id);
      if(idx!==-1) entries[idx]=updated;
    }
  }catch(e){}
  loadingIds.delete(entry.id); render();
}

async function fetchMissing(missing){ for(const e of missing) await fetchAndSave(e); }

async function refetchAll(){
  const fab=document.getElementById('fab'); fab.disabled=true; fab.textContent='Loading…';
  for(const e of entries) await fetchAndSave(e);
  fab.disabled=false; fab.textContent='Reload info';
}

// ── Logout ──
async function doLogout(){
  await fetch('/api/logout',{method:'POST',credentials:'include'});
  window.location.href='/';
}

// ── Boot ──
init();
</script>
